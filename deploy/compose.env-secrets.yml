# Values are materialized automatically from private docker.env. File mounts
# preserve read_only containers (Compose rejects environment-backed secrets).
secrets:
  connections: !override
    file: ${ENV_SECRETS_DIR:?Run the project launcher}/connections.json
  admin_password_hash: !override
    file: ${ENV_SECRETS_DIR}/admin_password_hash.secret
  session_signing_key: !override
    file: ${ENV_SECRETS_DIR}/session_signing_key.secret
  auth_proxy_key: !override
    file: ${ENV_SECRETS_DIR}/auth_proxy_key.secret
  neo4j-password: !override
    file: ${ENV_SECRETS_DIR}/neo4j_password.secret
  drive: !override
    file: ${ENV_SECRETS_DIR}/drive.json
