# Optional API integration only. Neo4j runs separately via compose.neo4j.yml.
# Add AFTER the current runtime/auth overlays. It creates no graph or DB service.
services:
  api:
    build:
      args:
        INSTALL_GRAPH: "true"
    networks: [graph]
    environment:
      NEO4J_ENABLED: ${NEO4J_ENABLED:-false}
      NEO4J_SYNC_ENABLED: "false"
      NEO4J_SEARCH_ENABLED: ${NEO4J_SEARCH_ENABLED:-false}
      NEO4J_SEARCH_MODE: ${NEO4J_SEARCH_MODE:-shadow}
      NEO4J_RELATED_MODE: ${NEO4J_RELATED_MODE:-disabled}
      NEO4J_RELATED_TIMEOUT_SECONDS: ${NEO4J_RELATED_TIMEOUT_SECONDS:-8}
      NEO4J_FAIL_OPEN: "true"
      NEO4J_RUNTIME: docker
      NEO4J_URI_DOCKER: ${NEO4J_URI_DOCKER:-bolt://neo4j:7687}
      NEO4J_DATABASE: ${NEO4J_DATABASE:-neo4j}
      NEO4J_USER: ${NEO4J_USER:-neo4j}
      NEO4J_PASSWORD_FILE: /run/secrets/neo4j_password
      NEO4J_QUERY_TIMEOUT_SECONDS: ${NEO4J_QUERY_TIMEOUT_SECONDS:-3}
      NEO4J_CONNECT_TIMEOUT_SECONDS: ${NEO4J_CONNECT_TIMEOUT_SECONDS:-5}
    secrets:
      - source: neo4j-password
        target: neo4j_password
networks:
  graph:
    external: true
    name: etl-neo4j-graph
secrets:
  neo4j-password:
    file: ${NEO4J_PASSWORD_SECRET_FILE:?Set private password file from prepare-neo4j.py}
