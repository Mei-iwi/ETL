# Independent graph project; does not start or stop any existing database.
name: etl-neo4j
services:
  neo4j:
    image: ${NEO4J_DOCKER_IMAGE:-neo4j:5.26.18-community}
    restart: unless-stopped
    environment:
      NEO4J_AUTH_FILE: /run/secrets/neo4j_auth
      NEO4J_server_memory_heap_initial__size: ${NEO4J_HEAP_INITIAL_SIZE:-256M}
      NEO4J_server_memory_heap_max__size: ${NEO4J_HEAP_MAX_SIZE:-512M}
      NEO4J_server_memory_pagecache_size: ${NEO4J_PAGECACHE_SIZE:-256M}
      NEO4J_dbms_logs_debug_level: ${NEO4J_GRAPH_LOG_LEVEL:-INFO}
    secrets: [neo4j_auth]
    ports:
      - target: 7687
        published: "${NEO4J_BOLT_PORT:-7687}"
        host_ip: "${NEO4J_BIND_ADDRESS:-127.0.0.1}"
      - target: 7474
        published: "${NEO4J_HTTP_PORT:-7474}"
        host_ip: "${NEO4J_BIND_ADDRESS:-127.0.0.1}"
    volumes: [graph-data:/data, graph-logs:/logs]
    networks: [graph]
    mem_limit: ${NEO4J_MEMORY_LIMIT:-1536m}
    cpus: ${NEO4J_CPUS:-2}
    healthcheck:
      test: [CMD-SHELL, 'wget -q --spider http://localhost:7474/ || exit 1']
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s
secrets:
  neo4j_auth:
    file: ${NEO4J_AUTH_FILE:?Prepare private Neo4j auth file first}
volumes:
  graph-data:
  graph-logs:
networks:
  graph:
    name: etl-neo4j-graph
