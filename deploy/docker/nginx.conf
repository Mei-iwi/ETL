worker_processes auto;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;
events { worker_connections 1024; }
http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    server_tokens off;
    log_format safe '$remote_addr $request_method $uri $status $body_bytes_sent';
    access_log /dev/stdout safe;
    client_body_temp_path /tmp/client_body;
    proxy_temp_path /tmp/proxy;
    fastcgi_temp_path /tmp/fastcgi;
    uwsgi_temp_path /tmp/uwsgi;
    scgi_temp_path /tmp/scgi;
    resolver 127.0.0.11 valid=10s ipv6=off;
    upstream etl_api {
        zone etl_api 64k;
        server api:8000 resolve;
    }
    map $http_origin $bad_origin {
        default 1;
        "" 0;
        ~^https?://(localhost|127\.0\.0\.1|\[::1\])(:[0-9]+)?$ 0;
    }
    map "$http_forwarded$http_x_forwarded_for$http_x_forwarded_host$http_x_forwarded_proto$http_x_real_ip" $spoofed_proxy {
        default 1;
        "" 0;
    }
    server {
        listen 8080 default_server;
        server_name localhost 127.0.0.1;
        root /usr/share/nginx/html;
        if ($host !~ ^(localhost|127\.0\.0\.1|\[::1\])$) { return 403; }
        if ($bad_origin) { return 403; }
        if ($spoofed_proxy) { return 403; }
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options SAMEORIGIN always;
        add_header Referrer-Policy no-referrer always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; frame-src 'self' blob:; object-src 'none'; base-uri 'self'; frame-ancestors 'self'; form-action 'self'" always;
        location = /web-health { access_log off; return 200 'ok'; add_header Content-Type text/plain; }
        location = /admin { return 403; }
        location ^~ /admin/ { return 403; }
        location = /docs {
            default_type text/html;
            try_files /api-docs/index.html =404;
            expires -1;
        }
        location = /docs/ { return 308 /docs$is_args$args; }
        location /api-docs/ { try_files $uri =404; expires -1; }
        location = /openapi.json {
            proxy_pass http://etl_api;
            proxy_http_version 1.1;
            proxy_set_header Host $http_host;
            proxy_set_header Connection "";
            proxy_buffering off;
            proxy_cache off;
        }
        location /api/ {
            client_max_body_size 501m;
            proxy_pass http://etl_api;
            proxy_http_version 1.1;
            proxy_set_header Host $http_host;
            proxy_set_header Connection "";
            proxy_set_header Forwarded "";
            proxy_set_header X-Forwarded-For "";
            proxy_set_header X-Forwarded-Host "";
            proxy_set_header X-Forwarded-Proto "";
            proxy_set_header X-Real-IP "";
            proxy_buffering off;
            proxy_request_buffering off;
            proxy_cache off;
            proxy_read_timeout 240s;
            proxy_send_timeout 240s;
        }
        location = /health {
            proxy_pass http://etl_api;
            proxy_set_header Host $http_host;
            proxy_buffering off;
        }
        location /assets/ { try_files $uri =404; expires 1y; }
        location / { try_files $uri $uri/ /index.html; expires -1; }
    }
}
