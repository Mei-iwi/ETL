[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"
[project]
name = "data-sync-etl"
version = "0.1.0"
description = "Standalone master data synchronization and page-level ETL"
requires-python = ">=3.12"
dependencies = [
 "fastapi>=0.115,<1", "uvicorn>=0.30,<1", "python-multipart>=0.0.9,<1", "SQLAlchemy>=2.0,<2.1",
 "alembic>=1.13,<2", "psycopg[binary]>=3.2,<4", "pydantic>=2.9,<3",
 "pydantic-settings>=2.5,<3", "PyMuPDF>=1.24,<2", "ijson>=3.3,<4",
 "python-ulid>=3,<4",
 "pymongo>=4.10,<5", "underthesea==8.3.0",
 "python-docx>=1.2,<2", "openpyxl>=3.1.5,<4", "Pillow>=11.3,<13",
 "python-pptx>=1.0.2,<2",
 "argon2-cffi>=23.1,<26",
]
[project.optional-dependencies]
google-drive = ["google-auth[requests]>=2.40,<3", "requests>=2.32,<3", "google-auth-oauthlib>=1.2,<2"]
embeddings = ["sentence-transformers>=3,<6"]
semantic = ["FlagEmbedding==1.3.5", "transformers==4.51.3", "peft==0.15.2",
 "sentence-transformers==3.4.1", "huggingface-hub==0.30.2", "datasets==3.6.0",
 "accelerate==1.6.0"]
dev = ["pytest>=8,<10", "pytest-asyncio>=0.24,<2", "httpx>=0.27,<1", "ruff>=0.9,<1"]
[project.scripts]
etl = "data_sync_etl.cli.main:main"
[tool.setuptools.packages.find]
where = ["src"]
[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["postgres: requires isolated PostgreSQL test database"]
[tool.ruff]
line-length = 100
target-version = "py312"
[tool.ruff.lint]
select = ["E", "F", "I", "B"]
ignore = ["E501"]

[tool.setuptools.package-data]
data_sync_etl = ["domain/data/*.json"]
