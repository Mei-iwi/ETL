[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"
[project]
name = "data-sync-etl"
version = "0.1.0"
description = "Standalone master data synchronization and page-level ETL"
requires-python = ">=3.12"
dependencies = [
 "fastapi>=0.115,<1", "uvicorn>=0.30,<1", "SQLAlchemy>=2.0,<2.1",
 "alembic>=1.13,<2", "psycopg[binary]>=3.2,<4", "pydantic>=2.9,<3",
 "pydantic-settings>=2.5,<3", "PyMuPDF>=1.24,<2", "ijson>=3.3,<4",
 "python-ulid>=3,<4"
]
[project.optional-dependencies]
dev = ["pytest>=8,<10", "pytest-asyncio>=0.24,<2", "httpx>=0.27,<1", "ruff>=0.9,<1"]
[project.scripts]
etl = "data_sync_etl.cli.main:main"
[tool.setuptools.packages.find]
where = ["src"]
[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["postgres: requires isolated PostgreSQL test database"]
[tool.ruff]
line-length = 100
target-version = "py312"
[tool.ruff.lint]
select = ["E", "F", "I", "B"]
ignore = ["E501"]
