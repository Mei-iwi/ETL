name: etl-master-data

services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-etl}
      POSTGRES_DB: ${POSTGRES_DB:-etl}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 3s
      retries: 10
  source-postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: ${SOURCE_POSTGRES_USER:-etl_source_admin}
      POSTGRES_DB: ${SOURCE_POSTGRES_DB:-etl_source}
      POSTGRES_PASSWORD: ${SOURCE_POSTGRES_PASSWORD:?Set SOURCE_POSTGRES_PASSWORD separately}
    ports:
      - "127.0.0.1:${SOURCE_POSTGRES_PORT:-5433}:5432"
    volumes:
      - source_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 3s
      retries: 10
  master-migrate:
    build:
      context: .
      target: runtime
    image: etl-master-data-runtime:local
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-etl}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-etl}
    command: ["python", "-m", "alembic", "upgrade", "head"]
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"
  source-migrate:
    image: etl-master-data-runtime:local
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-etl}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-etl}
      SOURCE_MIGRATION_DATABASE_URL: postgresql+psycopg://${SOURCE_POSTGRES_USER:-etl_source_admin}:${SOURCE_POSTGRES_PASSWORD}@source-postgres:5432/${SOURCE_POSTGRES_DB:-etl_source}
    command: ["python", "-m", "alembic", "-c", "alembic_source.ini", "upgrade", "head"]
    depends_on:
      master-migrate:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      source-postgres:
        condition: service_healthy
    restart: "no"
  mongo-init:
    image: etl-master-data-runtime:local
    environment:
      MONGO_URI: mongodb://mongo:27017
      MONGO_DATABASE: ${MONGO_DATABASE:-etl_content}
      INDEX_EMBEDDING_DIMENSION: ${INDEX_EMBEDDING_DIMENSION:-384}
    command: ["python", "-m", "data_sync_etl.adapters.mongo.schema", "--bootstrap-empty"]
    depends_on:
      master-migrate:
        condition: service_completed_successfully
      mongo:
        condition: service_healthy
    healthcheck:
      disable: true
    restart: "no"
  mongo:
    image: mongo:8.0
    ports:
      - "127.0.0.1:${MONGO_PORT:-27018}:27017"
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 5s
      timeout: 3s
      retries: 10
volumes:
  postgres_data:
  mongo_data:
  source_postgres_data:
